services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: ./backend/.env.example
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app

  celery:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker -l info
    env_file: ./backend/.env.example
    depends_on: [redis, postgres]
    volumes:
      - ./backend:/app

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm i && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
    depends_on: [backend]

volumes:
  pgdata:
