[project]
name = "messanger-backend"
version = "0.1.0"
description = "Telegram-lite messenger backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "python-multipart==0.0.17",
  "pyjwt==2.10.1",
  "passlib[bcrypt]==1.7.4",
  "redis==5.2.1",
  "celery==5.4.0",
  "structlog==24.4.0",
  "python-slugify==8.0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.alembic]
script_location = "alembic"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
